<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafeta</title>
    <meta
      name="description"
      content="Connect with fellow INTEC students through a vibrant social network, share resources, and engage in academic discussions tailored for university life."
    />
    <meta name="robots" content="noindex, nofollow" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
    </style>
    <script>
      // Pinta el tema antes del primer render: sin esto, la app oscura
      // parpadearía en claro mientras carga React.
      try {
        var saved = JSON.parse(
          localStorage.getItem('cafeta.appstate.v1') || '{}',
        );
        var theme = (saved.settings && saved.settings.theme) || 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('dark', theme === 'dark');
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
