# Revisión en cada push y PR: lint, formato, tipos, build y pruebas.
# En main, si todo pasa, sube dist/ y deploy/server.mjs a su Web App de App Service (spec 0006).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # En las ramas un push nuevo cancela el CI viejo; en main nunca se corta un despliegue.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # La URL de la API y el monitoreo (spec 0007) quedan fijos en el build; sin
      # ellos, no se publica. El build sube los source maps a Sentry y los borra.
      - run: test -n "$VITE_API_URL" && test -n "$VITE_SENTRY_DSN" && test -n "$SENTRY_AUTH_TOKEN" && npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      # En el paquete, server.mjs queda en la raíz junto a dist/ (startup: node server.mjs).
      - name: Empaquetar
        run: |
          mkdir package
          cp -r dist package/dist
          # version.txt lleva el commit; la prueba de humo espera verlo publicado.
          printf '%s' "$GITHUB_SHA" > package/dist/version.txt
          cp deploy/server.mjs package/server.mjs
          # Ningún source map se publica (spec 0007).
          ! find package -name '*.map' | grep -q .
          (cd package && zip -qr ../app.zip .)
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: app.zip
      # Azure sigue sirviendo la versión anterior un rato: solo cuenta ver el commit nuevo.
      - name: Prueba de humo
        run: |
          for i in $(seq 1 30); do
            if [ "$(curl -fsS "${{ vars.PUBLIC_URL }}/version.txt")" = "$GITHUB_SHA" ]; then
              echo "Ya se sirve $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "No se vio $GITHUB_SHA en 5 minutos" >&2
          exit 1
