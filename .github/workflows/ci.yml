# Revisión en cada push y PR: lint, formato, tipos, build y pruebas.
# En main, si todo pasa, sube dist/ y deploy/server.mjs a su Web App de App Service (spec 0006).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # En las ramas un push nuevo cancela el CI viejo; en main nunca se corta un despliegue.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # La URL de la API de producción queda fija en el build; sin ella, no se publica.
      - run: test -n "$VITE_API_URL" && npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      # En el paquete, server.mjs queda en la raíz junto a dist/ (startup: node server.mjs).
      - name: Empaquetar
        run: |
          mkdir package
          cp -r dist package/dist
          cp deploy/server.mjs package/server.mjs
          (cd package && zip -qr ../app.zip .)
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: app.zip
      - name: Prueba de humo
        run: curl --fail --silent --show-error --output /dev/null --retry 30 --retry-delay 10 --retry-all-errors "${{ vars.PUBLIC_URL }}"
