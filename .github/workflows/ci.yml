# Revisión en cada push y PR: lint, formato, tipos, build y pruebas.
# En main, si todo pasa, publica dist/ en Static Web Apps (spec 0006).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # En las ramas un push nuevo cancela el CI viejo; en main nunca se corta un despliegue.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # La URL de la API de producción queda fija en el build; sin ella, no se publica.
      - run: test -n "$VITE_API_URL" && npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
      - name: Prueba de humo
        run: curl --fail --silent --show-error --output /dev/null --retry 10 --retry-delay 6 --retry-all-errors "${{ vars.PUBLIC_URL }}"
